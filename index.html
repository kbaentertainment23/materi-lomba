        function calculateProgress() {
            const totalSteps = pagesMeta.length;
            const completedCount = appState.completedPages.length;
            return Math.min(100, Math.round((completedCount / totalSteps) * 100));
        }

        function markPageCompleted(pageId) {
            if (!appState.completedPages.includes(pageId)) {
                appState.completedPages.push(pageId);
                saveState();
                updateProgressUI();
            }
        }

        function updateProgressUI() {
            const pct = calculateProgress();
            const headerText = document.getElementById('header-progress-text');
            const headerBar = document.getElementById('header-progress-bar');
            const mobileBar = document.getElementById('mobile-progress-bar');
            const mobilePct = document.getElementById('mobile-header-percent');
            const stepCounter = document.getElementById('sidebar-step-counter');

            if (headerText) headerText.textContent = `${pct}%`;
            if (headerBar) headerBar.style.width = `${pct}%`;
            if (mobileBar) mobileBar.style.width = `${pct}%`;
            if (mobilePct) mobilePct.textContent = `${pct}%`;
            if (stepCounter) stepCounter.textContent = `${appState.completedPages.length} / ${pagesMeta.length}`;
        }

        function renderNavigation() {
            const navList = document.getElementById('nav-list');
            if (!navList) return;

            navList.innerHTML = pagesMeta.map(page => {
                const isActive = appState.currentPage === page.id;
                const isDone = appState.completedPages.includes(page.id);

                return `
                    <button onclick="navigateTo(${page.id})" class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-left text-xs sm:text-sm transition ${
                        isActive
                            ? 'bg-navy-900 text-white font-bold shadow-sm'
                            : 'text-slate-700 hover:bg-slate-100 font-medium'
                    }">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <i data-lucide="${page.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-yellow-400' : (page.isQuiz ? 'text-blue-600' : 'text-slate-500')}"></i>
                            <span class="truncate">${page.shortTitle}</span>
                        </div>
                        ${isDone
                            ? `<span class="w-5 h-5 rounded-full ${isActive ? 'bg-yellow-400 text-navy-950' : 'bg-emerald-100 text-emerald-700'} flex items-center justify-center text-[11px] font-extrabold shrink-0">✓</span>`
                            : ''
                        }
                    </button>
                `;
            }).join('');
        }

        function navigateTo(pageId) {
            if (pageId < 1 || pageId > pagesMeta.length) return;

            // Tandai halaman sebelumnya sebagai selesai saat berpindah
            if (pageId !== appState.currentPage) {
                markPageCompleted(appState.currentPage);
            }

            appState.currentPage = pageId;
            saveState();
            renderPage();
            renderNavigation();
            updateProgressUI();

            // Tutup sidebar di layar mobile/tablet bila terbuka
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
                sidebar.classList.add('-translate-x-full');
                if (overlay) overlay.classList.add('hidden');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevPage() {
            if (appState.currentPage > 1) {
                navigateTo(appState.currentPage - 1);
            }
        }

        function nextPage() {
            markPageCompleted(appState.currentPage);
            if (appState.currentPage < pagesMeta.length) {
                navigateTo(appState.currentPage + 1);
            } else {
                navigateTo(1);
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;

            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const iconBg = document.getElementById('modal-icon-bg');
            const iconEl = document.getElementById('modal-icon');

            if (!modal || !titleEl || !msgEl) return;

            titleEl.textContent = title;
            msgEl.textContent = message;

            if (iconBg && iconEl) {
                if (type === 'success') {
                    iconBg.className = 'p-2.5 rounded-xl bg-emerald-100 text-emerald-700';
                    iconEl.setAttribute('data-lucide', 'check-circle-2');
                } else if (type === 'warning') {
                    iconBg.className = 'p-2.5 rounded-xl bg-amber-100 text-amber-800';
                    iconEl.setAttribute('data-lucide', 'alert-triangle');
                } else {
                    iconBg.className = 'p-2.5 rounded-xl bg-blue-100 text-blue-700';
                    iconEl.setAttribute('data-lucide', 'info');
                }
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function resetLearningProgress() {
            appState.completedPages = [];
            appState.quizzes = {};
            appState.guessAnswers = {};
            appState.guessChecked = {};
            appState.bugFixed = {};
            appState.currentPage = 1;
            saveState();
            renderNavigation();
            renderPage();
            updateProgressUI();
            showModal('Progres Direset', 'Seluruh catatan progres belajar, latihan soal, dan tantangan debug telah diulang dari awal.', 'info');
        }

        function runSimulation() {
            const outEl = document.getElementById('sim-output');
            const inp1 = document.getElementById('sim-input-1');
            const inp2 = document.getElementById('sim-input-2');
            if (!outEl || !inp1) return;

            try {
                const v1 = parseInt(inp1.value, 10);
                if (Number.isNaN(v1)) {
                    outEl.className = 'bg-navy-950 text-rose-400 p-4 rounded-xl font-mono text-xs sm:text-sm';
                    outEl.textContent = 'Error: Masukkan angka bilangan bulat yang valid.';
                    return;
                }

                let hasilText = '';
                if (appState.simMode === 'ganjil_genap') {
                    hasilText = (v1 % 2 === 0) ? 'GENAP' : 'GANJIL';
                } else if (appState.simMode === 'bus_lomba') {
                    const v2 = inp2 ? parseInt(inp2.value, 10) : 20;
                    if (Number.isNaN(v2) || v2 <= 0) {
                        outEl.className = 'bg-navy-950 text-rose-400 p-4 rounded-xl font-mono text-xs sm:text-sm';
                        outEl.textContent = 'Error: Kapasitas kursi harus lebih besar dari 0 (hindari pembagian nol).';
                        return;
                    }
                    let bus = Math.trunc(v1 / v2);
                    if (v1 % v2 !== 0) bus += 1;
                    hasilText = String(bus);
                } else {
                    const jam = Math.trunc(v1 / 60);
                    const sisa = v1 % 60;
                    hasilText = `${jam} Jam ${sisa} Menit`;
                }

                outEl.className = 'bg-navy-950 text-emerald-400 p-4 rounded-xl font-mono text-xs sm:text-sm font-bold';
                outEl.textContent = hasilText;
                markPageCompleted(11);

        function selectQuizOption(quizKey, qIndex, optIndex) {
            if (!appState.quizzes[quizKey]) {
                appState.quizzes[quizKey] = { selected: {}, submitted: false, score: 0 };
            }
            if (appState.quizzes[quizKey].submitted) return;
            appState.quizzes[quizKey].selected[qIndex] = optIndex;
            saveState();
            renderPage();
        }

        function submitQuiz(quizKey) {
            const questions = quizBanks[quizKey] || [];
            const qState = appState.quizzes[quizKey] || { selected: {}, submitted: false, score: 0 };

            if (Object.keys(qState.selected).length < questions.length) {
                showModal('Belum Lengkap', 'Silakan jawab seluruh 10 soal terlebih dahulu sebelum menekan Periksa Jawaban.', 'warning');
                return;
            }

            let score = 0;
            questions.forEach((item, idx) => {
                if (qState.selected[idx] === item.ans) score += 1;
            });

            qState.score = score;
            qState.submitted = true;
            appState.quizzes[quizKey] = qState;

            const currentMeta = pagesMeta.find(p => p.quizKey === quizKey);
            if (currentMeta) markPageCompleted(currentMeta.id);

            saveState();
            renderPage();
            updateProgressUI();
            renderNavigation();
            showModal('Latihan Selesai!', `Kamu memperoleh skor ${score} dari ${questions.length} soal (${score * 10} poin). Lihat pembahasan di tiap soal.`, 'success');
        }

        function resetQuiz(quizKey) {
            appState.quizzes[quizKey] = { selected: {}, submitted: false, score: 0 };
            saveState();
            renderPage();
        }

                    <button onclick="navigateTo(1)" class="px-5 py-3 rounded-xl bg-navy-900 hover:bg-navy-800 text-white font-bold text-sm transition min-h-[44px]">
                        Kembali ke Beranda
                    </button>
                    <button onclick="resetLearningProgress()" class="px-5 py-3 rounded-xl bg-white hover:bg-rose-50 text-rose-700 border border-rose-200 font-bold text-sm transition min-h-[44px]">
                        Ulangi Semua Materi
                    </button>
                </div>
            `;
        }

        function renderPage() {
            const container = document.getElementById('page-container');
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            const nextText = document.getElementById('btn-next-text');
            const bottomInd = document.getElementById('bottom-page-indicator');
            const mobileInd = document.getElementById('mobile-page-indicator');

            if (!container) return;

            let html = '';
            switch (appState.currentPage) {
                case 1: html = getPage1HTML(); break;
                case 2: html = getPage2HTML(); break;
                case 3: html = getPage3HTML(); break;
                case 4: html = getQuizHTML('basic', 'Latihan Bagian 1: Dasar C++, Variabel & I/O', 'Latihan 1 • 10 Soal'); break;
                case 5: html = getPage5HTML(); break;
                case 6: html = getPage6HTML(); break;
                case 7: html = getQuizHTML('divmod', 'Latihan Bagian 2: Operator DIV (/) & MOD (%)', 'Latihan 2 • 10 Soal'); break;
                case 8: html = getPage8HTML(); break;
                case 9: html = getQuizHTML('ifelse', 'Latihan Bagian 3: Percabangan IF, ELSE IF & ELSE', 'Latihan 3 • 10 Soal'); break;
                case 10: html = getPage10HTML(); break;
                case 11: html = getPage11HTML(); break;
                case 12: html = getQuizHTML('final', 'Kuis Tantangan Akhir: Kombinasi Lomba C++', 'Kuis Akhir • 10 Soal'); break;
                case 13: html = getPageArenaHTML(); break;
                case 14: html = getPage14HTML(); break;
                default: html = getPage1HTML();
            }

            container.innerHTML = html;

            if (prevBtn) prevBtn.disabled = appState.currentPage <= 1;
            if (nextText) {
                nextText.textContent = appState.currentPage >= pagesMeta.length ? 'Ke Awal' : 'Selanjutnya';
            }
            if (bottomInd) bottomInd.textContent = `Halaman ${appState.currentPage} dari ${pagesMeta.length}`;
            if (mobileInd) mobileInd.textContent = `${appState.currentPage} / ${pagesMeta.length}`;

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // ==========================================
        // 5. DUKUNGAN PWA (LOGO C++ & INSTALL PROMPT)
        // ==========================================
        let deferredPrompt = null;

        function generateCppIconDataUrl(size) {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                if (!ctx) return '';

                // Latar belakang navy bulat/kotak penuh
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, size, size);

                // Emblem segi enam biru
                const cx = size / 2;
                const cy = size / 2;
                const r = size * 0.38;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i - Math.PI / 6;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fillStyle = '#1d4ed8';
                ctx.fill();
                ctx.lineWidth = Math.max(2, size * 0.025);
                ctx.strokeStyle = '#facc15';
                ctx.stroke();

                // Teks C++
                ctx.fillStyle = '#facc15';
                ctx.font = `800 ${Math.round(size * 0.23)}px "Plus Jakarta Sans", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('C++', cx, cy + size * 0.015);

                return canvas.toDataURL('image/png');
            } catch (e) {
                return '';
            }
        }

        function setupPWA() {
            const icon192 = generateCppIconDataUrl(192);
            const icon512 = generateCppIconDataUrl(512);

            const fav = document.getElementById('pwa-favicon');
            const appleIcon = document.getElementById('pwa-apple-icon');
            const manifestLink = document.getElementById('pwa-manifest-link');

            if (icon192) {
                if (fav) fav.href = icon192;
                if (appleIcon) appleIcon.href = icon192;
            }

            if (manifestLink && (icon192 || icon512)) {
                const manifestObj = {
                    name: "BELAJAR C++: MOD, DIV, DAN IF/ELSE",
                    short_name: "Belajar C++",
                    start_url: "./",
                    display: "standalone",
                    background_color: "#0f172a",
                    theme_color: "#0f172a",
                    icons: [
                        { src: icon192 || icon512, sizes: "192x192", type: "image/png" },
                        { src: icon512 || icon192, sizes: "512x512", type: "image/png" }
                    ]
                };
                const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
                manifestLink.href = URL.createObjectURL(blob);
            }

            const installBtn = document.getElementById('pwa-install-btn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('inline-flex');
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });
        }

        async function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                return;
            }
            showModal(
                'Install Aplikasi Belajar C++',
                'Untuk memasang di HP atau komputer: buka menu browser (ikon titik tiga atau Share) lalu pilih "Add to Home Screen" / "Install App". Ikon logo C++ akan langsung muncul di layar utama.',
                'info'
            );
        }

        // ==========================================
        // 6. INISIALISASI APLIKASI
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            setupPWA();
            renderNavigation();
            renderPage();
            updateProgressUI();
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
